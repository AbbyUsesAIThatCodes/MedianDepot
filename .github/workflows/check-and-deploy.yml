name: Publish Locally Verified Pages

on:
  workflow_dispatch:
    inputs:
      expected_build_id:
        description: Exact build ID from deployment/payload.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'AbbyUsesAIThatCodes/MedianDepot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            site
            deployment
      - name: Verify The Locally Tested Payload
        run: node deployment/verify.mjs
        env:
          EXPECTED_BUILD_ID: ${{ inputs.expected_build_id }}
      - name: Read Existing Pages Configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Upload One Small Pages Artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
          retention-days: 1
      - name: Publish The Identified Runtime
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Record The Published Identity
        env:
          BUILD_ID: ${{ inputs.expected_build_id }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Published $BUILD_ID to $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
